<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <link rel="stylesheet" href="fonts.css">
    <link rel="stylesheet" href="tokens.css">
    <title>CSS Selector REPL</title>
    <style>
      :root { color-scheme: light dark; }
      html, body { max-width: 100%; overflow-x: clip; }
      body {
        margin: 0;
        color: var(--csrepl-fg);
        font: 400 13px/1.3 "Baloo 2", system-ui, sans-serif;
        background: var(--csrepl-bg, #ffffff);
      }
      #app { box-sizing: border-box; max-width: 100%; overflow-x: clip; padding: 10px; }
      #meta, #error { margin: 0 0 12px; }
      #meta.meta-head {
        display: grid;
        gap: 10px;
        padding: 12px 14px;
        border: 2px solid var(--csrepl-accent);
        border-radius: 14px;
        background: linear-gradient(145deg, var(--csrepl-accent-soft), var(--csrepl-soft));
        box-shadow: 0 4px 18px rgb(0 0 0 / 22%);
        overflow-wrap: anywhere;
      }
      #meta.meta-empty {
        margin: 0 0 12px;
        padding: 14px;
        border: 2px dashed rgb(255 255 255 / 18%);
        border-radius: 14px;
        color: var(--csrepl-muted);
        font: 600 14px/1.35 "Baloo 2", system-ui, sans-serif;
        text-align: center;
      }
      #meta-count {
        display: flex;
        align-items: baseline;
        gap: 8px;
        min-width: 0;
      }
      #meta-count .meta-stat-num {
        font: 800 36px/1 "Baloo 2", system-ui, sans-serif;
        color: var(--csrepl-accent);
        letter-spacing: -0.02em;
        font-variant-numeric: tabular-nums;
      }
      #meta-count .meta-stat-label {
        font: 700 13px/1 "Baloo 2", system-ui, sans-serif;
        color: var(--csrepl-fg);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        opacity: 0.88;
      }
      #meta-selector {
        display: block;
        max-width: 100%;
        margin: 0;
        padding: 10px 12px;
        border: 1px solid rgb(255 255 255 / 16%);
        border-radius: 10px;
        color: rgb(255 246 220);
        background: rgb(0 0 0 / 28%);
        box-shadow: inset 0 1px 0 rgb(255 255 255 / 8%);
        font: 700 15px/1.45 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
        overflow-wrap: anywhere;
        word-break: break-word;
      }
      #meta-selector::before {
        content: "Query";
        display: block;
        margin-bottom: 6px;
        color: var(--csrepl-muted);
        font: 700 10px/1 "Baloo 2", system-ui, sans-serif;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      #error { color: var(--csrepl-error); display: none; }
      #list { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
      #list li {
        display: flex;
        flex-direction: column;
        gap: 6px;
        min-width: 0;
        border: 2px solid transparent;
        border-radius: 12px;
        padding: 7px 8px;
        background: var(--csrepl-soft);
        cursor: pointer;
        transition: border-color 120ms ease, background 120ms ease;
      }
      #list li:hover { border-color: var(--csrepl-accent); background: var(--csrepl-soft-strong); }
      #list li.is-active { border-color: var(--csrepl-accent); background: var(--csrepl-accent-soft); }
      #list .row-section {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        min-width: 0;
        align-items: center;
        padding: 2px 0 0 10px;
        border-left: 4px solid rgb(255 255 255 / 14%);
      }
      #list .row-section.identity {
        border-left-color: rgb(255 204 0 / 42%);
        align-items: stretch;
      }
      #list .row-section.identity .chip.tag,
      #list .row-section.identity .chip.id {
        align-self: stretch;
        box-sizing: border-box;
        font-size: 17px;
        font-weight: 800;
        line-height: 1.25;
        min-height: 2.3125rem;
        padding-block: 5px;
      }
      #list .row-section.classes { border-left-color: rgb(182 148 255 / 48%); }
      #list .row-section.attrs { display: grid; gap: 4px; border-left-color: rgb(148 214 255 / 46%); }
      #list .row-section.text {
        display: block;
        border-left-color: rgb(255 255 255 / 34%);
        background: rgb(255 255 255 / 4%);
        border-radius: 0 8px 8px 0;
        padding-bottom: 2px;
      }
      #list .pill,
      #list .chip {
        display: inline-flex;
        align-items: center;
        max-width: 100%;
        min-width: 0;
        padding: 3px 9px;
        border: none;
        border-radius: 999px;
        font-style: normal;
        font-weight: 700;
        letter-spacing: 0.01em;
        line-height: 1.4;
        white-space: normal;
        overflow-wrap: anywhere;
        word-break: break-word;
      }
      #list .pill.tag,
      #list .chip.tag {
        border-radius: 4px;
        font-weight: 800;
        background: rgb(255 191 0 / 40%);
        color: rgb(255 246 199);
        font-size: 18px;
      }
      #list .pill.id,
      #list .chip.id {
        border-radius: 4px;
        background: rgb(82 209 255 / 32%);
        color: rgb(216 246 255);
        font-size: 16px;
      }
      #list .pill.cls,
      #list .chip.cls {
        border-radius: 999px 999px 999px 8px;
        background: rgb(168 85 255 / 34%);
        color: rgb(244 227 255);
        font-size: 16px;
      }
      #list .pill.attr,
      #list .chip.attr {
        border-radius: 6px;
        background: rgb(18 194 166 / 26%);
        color: rgb(208 255 247);
        margin: 2px 0;
        font-size: 14px;
        font-weight: 600;
      }
      #list .pill.text,
      #list .chip.text {
        display: -webkit-box;
        align-items: flex-start;
        border-radius: 0;
        background: rgb(255 138 128 / 10%);
        color: rgb(255 218 214);
        font-size: 17px;
        font-weight: 600;
        font-style: italic;
        opacity: 0.95;
        padding: 4px 9px;
        line-height: 1.45;
        overflow: hidden;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
      }
    </style>
  </head>
  <body>
    <main id="app">
      <div id="meta" class="meta-empty">No selector yet.</div>
      <p id="error"></p>
      <ul id="list"></ul>
    </main>
    <script src="sidebar.js"></script>
  </body>
</html>
