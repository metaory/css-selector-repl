<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>queryselector-debugger</title>
    <style>
      @font-face {
        font-family: "Baloo 2";
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url("assets/fonts/baloo-2-latin-400-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "Baloo 2";
        font-style: normal;
        font-weight: 600;
        font-display: swap;
        src: url("assets/fonts/baloo-2-latin-600-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "Baloo 2";
        font-style: normal;
        font-weight: 800;
        font-display: swap;
        src: url("assets/fonts/baloo-2-latin-800-normal.woff2") format("woff2");
      }
      :root {
        color-scheme: light dark;
        --sdbg-bg: #220044;
        --sdbg-surface: rgba(255, 255, 255, 0.08);
        --sdbg-text: rgba(255, 255, 255, 0.92);
        --sdbg-muted: rgba(255, 255, 255, 0.7);
        --sdbg-error: #ff8a80;
        --sdbg-match: #ff7a45;
        --sdbg-active: #52d1ff;
      }
      * { font-family: "Baloo 2", system-ui, sans-serif; }
      body {
        margin: 0;
        /* background: var(--sdbg-bg); */
        color: var(--sdbg-text);
        font: 400 13px/1.3 "Baloo 2", system-ui, sans-serif;
        color-scheme: light dark;
        /* background: transparent !important; */
        background: var(--sdbg-bg, #ffffff) !important;
      }
      
      /* @media (prefers-color-scheme: dark) { */
      /*   body { */
      /*     background: transparent !important; */
      /*   } */
      /* } */
      #app { padding: 10px; }
      #meta { margin: 0 0 10px; color: var(--sdbg-muted); word-break: break-word; }
      #error { margin: 0 0 10px; color: var(--sdbg-error); display: none; }
      #list { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
      #list li { border: 2px dashed var(--sdbg-match); border-radius: 12px; padding: 8px; background: var(--sdbg-surface); color: var(--sdbg-text); cursor: pointer; font-size: 16px; line-height: 1.35; font-weight: 600; word-break: break-word; transition: font-size 120ms ease, font-weight 120ms ease, border-color 120ms ease; }
      #list li:hover { font-size: 18px; font-weight: 700; }
      #list li.is-active { border-color: var(--sdbg-active); font-size: 20px; font-weight: 800; }
    </style>
  </head>
  <body>
    <main id="app">
      <p id="meta">No selector yet.</p>
      <p id="error"></p>
      <ul id="list"></ul>
    </main>
    <script src="sidebar.js"></script>
  </body>
</html>
