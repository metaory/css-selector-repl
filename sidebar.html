<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <link rel="stylesheet" href="fonts.css">
    <link rel="stylesheet" href="tokens.css">
    <title>CSS Selector REPL</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        color: var(--csrepl-fg);
        font: 400 13px/1.3 "Baloo 2", system-ui, sans-serif;
        background: var(--csrepl-bg, #ffffff);
      }
      #app { padding: 10px; }
      #meta, #error { margin: 0 0 10px; }
      #meta { color: var(--csrepl-muted); word-break: break-word; }
      #error { color: var(--csrepl-error); display: none; }
      #list { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
      #list li { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; border: 2px solid transparent; border-radius: 12px; padding: 6px 8px; background: var(--csrepl-soft); cursor: pointer; transition: border-color 120ms ease, background 120ms ease; }
      #list li:hover { border-color: var(--csrepl-accent); background: var(--csrepl-soft-strong); }
      #list li.is-active { border-color: var(--csrepl-accent); background: var(--csrepl-accent-soft); }
      #list .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; line-height: 1.45; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
      #list .pill.tag  { background: hsl(var(--hue) 55% 45% / 0.35); color: hsl(var(--hue) 90% 80%); font-weight: 800; }
      #list .pill.id   { background: var(--csrepl-accent-soft); color: var(--csrepl-accent); font-weight: 700; }
      #list .pill.cls  { background: hsl(var(--hue) 65% 45% / 0.25); color: hsl(var(--hue) 80% 78%); }
      #list .pill.attr { background: hsl(var(--hue) 40% 40% / 0.18); color: hsl(var(--hue) 55% 80%); font-style: italic; border: 1px solid hsl(var(--hue) 50% 50% / 0.35); }
      #list .pill.text { background: transparent; color: var(--csrepl-fg); font-style: italic; font-weight: 500; opacity: 0.85; flex: 1 1 auto; min-width: 0; }
    </style>
  </head>
  <body>
    <main id="app">
      <p id="meta">No selector yet.</p>
      <p id="error"></p>
      <ul id="list"></ul>
    </main>
    <script src="sidebar.js"></script>
  </body>
</html>
