<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <link rel="stylesheet" href="fonts.css">
    <link rel="stylesheet" href="tokens.css">
    <title>queryselector-debugger</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        color: var(--sdbg-text);
        font: 400 13px/1.3 "Baloo 2", system-ui, sans-serif;
        background: var(--sdbg-bg, #ffffff);
      }
      #app { padding: 10px; }
      #meta, #error { margin: 0 0 10px; }
      #meta { color: var(--sdbg-muted); word-break: break-word; }
      #error { color: var(--sdbg-error); display: none; }
      #list { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
      #list li { border: 2px dashed var(--sdbg-match); border-radius: 12px; padding: 8px; background: var(--sdbg-surface); color: var(--sdbg-text); cursor: pointer; font-size: 16px; line-height: 1.35; font-weight: 600; word-break: break-word; transition: font-size 120ms ease, font-weight 120ms ease, border-color 120ms ease, color 120ms ease; }
      #list li:hover { font-size: 18px; font-weight: 700; color: var(--sdbg-active); }
      #list li:hover, #list li.is-active { border-color: var(--sdbg-active); }
      #list li.is-active { border-style: solid; font-size: 20px; font-weight: 800; }
      #list li .entry-text-full { display: none; }
      #list li:hover .entry-text-preview { display: none; }
      #list li:hover .entry-text-full { display: inline; }
    </style>
  </head>
  <body>
    <main id="app">
      <p id="meta">No selector yet.</p>
      <p id="error"></p>
      <ul id="list"></ul>
    </main>
    <script src="sidebar.js"></script>
  </body>
</html>
